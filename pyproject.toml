[project]
name = "correction-potential-stopping"
version = "1.0.0"
description = "Correction-potential early stopping for Qwen3 and DeepSeek reasoning models"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0", "PyYAML>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
