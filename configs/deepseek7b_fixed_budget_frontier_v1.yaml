budget:
  retained_fractions: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
  position_rule: floor_fraction_of_complete_dense_generated_tokens
  minimum_retained_dense_tokens: 1
  zero_dense_policy: dense_fallback

datasets:
  gsm8k:
    heldout: 1319
  math500:
    heldout: 500
  aime:
    heldout: 30

reporting:
  split: heldout
  prompt_tokens_excluded: true
  total_token_cost_includes_forced_answer_suffix_and_generated_answer: true
  dense_reference: frozen_selective32k_source_artifact
  bootstrap_replicates: 10000

