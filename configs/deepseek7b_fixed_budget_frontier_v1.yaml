protocol_id: cps_deepseek_r1_distill_qwen_7b_fixed_relative_budget_frontier_selective32k_v1
seed: 20260820

model:
  id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  local_path: models/DeepSeek-R1-Distill-Qwen-7B
  dtype: bfloat16
  attention_backend: sdpa
  frozen: true

source:
  config: configs/deepseek7b_main_v3_selective32k.yaml
  output_root: results/deepseek7b_main_v3_selective32k
  cache_subdirectory: cache
  split: heldout
  dense_max_new_tokens: 32768
  require_source_protocol_fingerprint: true
  selective_extension_manifest: results/deepseek7b_main_v3_selective32k/SELECTIVE_DENSE_EXTENSION_MANIFEST.json

generation:
  dense_temperature: 0.6
  dense_top_p: 0.95
  dense_top_k: 20
  dense_do_sample: true
  dense_max_new_tokens: 32768
  force_answer_suffix: "\n</think>\n\n\\boxed{"
  force_answer_strategy: greedy_argmax
  force_answer_do_sample: false
