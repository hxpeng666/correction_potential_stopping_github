primary: false
runnable: true
protocol_id: cps_deepseek7b_deterministic_grader_pair_v1
report_label: Deterministic paired original-vs-forced-at-cap grader comparison
seed: 0
model:
  id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  local_path: Weights/DeepSeek/DeepSeek-R1-Distill-Qwen-7B
  dtype: bfloat16
  attention_backend: sdpa
  frozen: true
  hidden_size: 3584
  num_hidden_layers: 28
generation:
  dense_max_new_tokens: 13000
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  do_sample: true
  force_answer_max_new_tokens: 48
  forced_answer_strategy: greedy_argmax
  forced_answer_do_sample: false
  force_answer_suffix: "\n</think>\n\n\\boxed{"
  cap_final_answer_grader: condition_specific_original_or_forced_at_exact_13k
checkpoint:
  schedule: paragraph
  boundary_regex: "\\n\\s*\\n+"
  range_filter: none
  zero_checkpoint_policy: dense_fallback
  reasoning_end: first_think_close_or_full_dense_content
features:
  primary_kind: full_no_delta
  primary_width: 3590
  layer_zero_based: 16
probe:
  shared_architecture: [3590, 384, 96, 1]
  layer_norm_after_first_linear: true
  activation: GELU
  dropout: [0.15, 0.10]
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.001
  trajectory_batch_size: 24
  gradient_clip: 2.0
  max_epochs: 24
  patience: 6
  internal_fit_fraction: 0.8
  scaler_fit_scope: probe_train_internal_fit_only
  trajectory_softmin_beta: 0.5
  trajectory_weight: 1.0
calibration:
  quantile_grid_size: 101
  empirical_lost_correct_budgets: [0, 1, 2, 4, 10]
  rate_matched_empirical_budgets: []
  historical_workpoints: {strict: 1, balanced: 2, aggressive: 4}
  coverage_targets: [0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
  primary_calibrator: trajectory_envelope_ltt
  ltt_alphas: [0.005, 0.01, 0.02, 0.03, 0.05, 0.10]
  ltt_delta: 0.05
  objective: token_reduction_reasoning_only
dynamic_policy:
  accuracy_epsilon: 0.01
data:
  split_unit: problem
  original_root: results/deepseek7b_main_v2/cache
  forced_cap_root: results/deepseek7b_forced_cap_grader_method_v1/views
  gsm8k: {probe_train: 1000, calibration: 500, heldout: 1319}
  math:
    probe_train: 1400
    calibration: 700
    source: hendrycks_math_train
    categories: [algebra, counting_and_probability, geometry, intermediate_algebra, number_theory, prealgebra, precalculus]
    per_category: {probe_train: 200, calibration: 100}
  math500: {heldout: 500, role: ood_test}
  aime: {heldout: 30, role: ood_test, train_and_calibration_source: math}
comparison:
  invariant_negative_control: correctness
  required_equality:
    - row_keys
    - features
    - labels
    - initial_state
    - training_history
    - best_epoch
    - final_state_tensors
    - score_tensors
  calibration_is_condition_specific: true
