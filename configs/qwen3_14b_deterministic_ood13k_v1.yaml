primary: true
runnable: true
protocol_id: cps_qwen3_14b_deterministic_ood13k_deepseek_aligned_v2
report_label: Qwen3-14B deterministic DeepSeek-aligned GSM8K/MATH/MATH-500/AIME2024 paragraph collection
# This is the Dense rollout seed, not the probe-training seed.  It intentionally
# matches the frozen DeepSeek-R1-Distill-Qwen-7B main-v2 collection.
seed: 20260820
reproducibility:
  protocol: cps_strict_determinism_v2_runtime_locked
  runtime_lock: configs/runtime_a100_torch271_cuda126_v1.json
  require_clean_git: true
  dense_rollout_reference: configs/deepseek7b_main_v2.yaml
  dense_rollout_base_seed: 20260820
prompt_tokenization:
  render: apply_chat_template_tokenize_false_add_generation_prompt_true
  encode: tokenizer_default_add_special_tokens
  reference: scripts/collect_deepseek7b_paragraph_v1.py
model:
  id: Qwen/Qwen3-14B
  local_path: models/Qwen3-14B
  dtype: bfloat16
  attention_backend: sdpa
  frozen: true
  hidden_size: 5120
  num_hidden_layers: 40
generation:
  dense_max_new_tokens: 13000
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  do_sample: true
  cap_hit_grader: forced_answer_at_exact_13k_prefix
  force_answer_max_new_tokens: 48
  forced_answer_strategy: greedy_argmax
  forced_answer_do_sample: false
  force_answer_suffix: "\n</think>\n\n\\boxed{"
checkpoint:
  schedule: paragraph
  boundary_regex: "\\n\\s*\\n+"
  range_filter: none
  zero_checkpoint_policy: dense_fallback
  reasoning_end: first_think_close_or_full_dense_content
features:
  primary_kind: hidden_scalars
  primary_width: 5126
  layer_zero_based: 20
probe:
  shared_architecture: [5126, 384, 96, 1]
  optimizer: AdamW
  learning_rate: 0.00005
  weight_decay: 0.001
  point_loss: checkpoint_proper_bce
  trajectory_aggregation: normalized_softmin
  trajectory_softmin_beta: 0.5
  trajectory_weight: 1.0
calibration:
  primary_calibrator: trajectory_envelope_ltt
  candidate_threshold_source: probe_train_only
  certification_split: independent_calibration_only
  alphas: [0.005, 0.01, 0.02, 0.03, 0.05, 0.10]
  delta: 0.05
  objective: total_generated_token_reduction
  empirical_budget_B_used: false
data:
  prepared_root: data/deepseek7b_main_v2
  split_unit: problem
  gsm8k: {probe_train: 1000, calibration: 500, heldout: 1319}
  math:
    probe_train: 1400
    calibration: 700
    categories: [algebra, counting_and_probability, geometry, intermediate_algebra, number_theory, prealgebra, precalculus]
    per_category: {probe_train: 200, calibration: 100}
  math500: {heldout: 500, role: ood_test}
  aime: {heldout: 30, role: ood_test, threshold_source: math_calibration}
determinism_gate:
  problem_id: math_train_prealgebra_00252
  require_cross_gpu_exact: true
  gpu_indices: [0, 1]
output_root: results/qwen3_14b_deterministic_ood13k_v1
