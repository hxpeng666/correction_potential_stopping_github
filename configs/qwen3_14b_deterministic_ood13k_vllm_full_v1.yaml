  split_unit: problem
  gsm8k: {probe_train: 1000, calibration: 500, heldout: 1319}
  math:
    probe_train: 1400
    calibration: 700
    categories: [algebra, counting_and_probability, geometry, intermediate_algebra, number_theory, prealgebra, precalculus]
    per_category: {probe_train: 200, calibration: 100}
  math500: {heldout: 500, role: ood_test}
  aime: {heldout: 30, role: ood_test, threshold_source: math_calibration}
determinism_gate:
  primary_problem_id: math_train_prealgebra_00252
  problems:
    - {dataset: math, split: probe_train, problem_id: math_train_prealgebra_00252}
    - {dataset: gsm8k, split: calibration, problem_id: gsm8k_train_02594}
