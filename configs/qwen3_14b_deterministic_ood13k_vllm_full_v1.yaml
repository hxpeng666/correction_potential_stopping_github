    LD_PRELOAD: "/mnt/hbnas/home/wj/conda_env/earlystop_vllm_hidden_v1/lib/libstdc++.so.6"
  forbidden_optional_packages: [flash-attn, xformers]
prompt_tokenization:
  render: apply_chat_template_tokenize_false_add_generation_prompt_true
  encode: tokenizer_default_add_special_tokens
  reference: scripts/collect_deepseek7b_paragraph_v1.py
  thinking_mode: qwen3_chat_template_default_enabled
model:
  id: Qwen/Qwen3-14B
  local_path: models/Qwen3-14B
  dtype: bfloat16
  frozen: true
  hidden_size: 5120
  num_hidden_layers: 40
generation:
  dense_max_new_tokens: 13000
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  do_sample: true
  cap_hit_grader: forced_answer_at_exact_13k_prefix
  force_answer_max_new_tokens: 48
  forced_answer_strategy: greedy_argmax
  forced_answer_do_sample: false
  force_answer_suffix: "\n</think>\n\n\\boxed{"
checkpoint:
  schedule: paragraph
  boundary_regex: "\\n\\s*\\n+"
  range_filter: none
  zero_checkpoint_policy: dense_fallback
  reasoning_end: first_think_close_or_full_dense_content
features:
  primary_kind: hidden_scalars
  primary_width: 5126
  layer_zero_based: 20
vllm:
  version: 0.18.1
  engine: v1
  tensor_parallel_size: 1
  dtype: bfloat16
  attention_backend: FLASH_ATTN
  attention_backend_change_is_replaced_runtime_only: true
  enforce_eager: true
  compilation: disabled
  enable_chunked_prefill: true
  async_scheduling: false
  max_model_len: 16384
  audited_max_prompt_tokens: 1315
  audited_max_total_with_cap_suffix_and_branch: 14369
  max_num_batched_tokens: 16384
  engine_seed: 0
  gpu_memory_utilization: 0.45
  approximate_engine_memory_gib_on_a100_80gb: 36.0
  per_request_seed: stable_seed_20260820_problem_id
  profiles:
    baseline_b1:
      dense: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
      hidden: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
      branches: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
    branch_apc_b1:
      dense: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
      hidden: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
      branches: {enable_prefix_caching: true, max_num_seqs: 1, request_batch_size: 1}
    branch_apc_b2:
      dense: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
      hidden: {enable_prefix_caching: false, max_num_seqs: 1, request_batch_size: 1}
      branches: {enable_prefix_caching: true, max_num_seqs: 2, request_batch_size: 2}
    full_apc_b2:
      dense: {enable_prefix_caching: false, max_num_seqs: 2, request_batch_size: 2}
      hidden: {enable_prefix_caching: false, max_num_seqs: 2, request_batch_size: 2}
      branches: {enable_prefix_caching: true, max_num_seqs: 2, request_batch_size: 2}
    full_apc_b4:
      dense: {enable_prefix_caching: false, max_num_seqs: 4, request_batch_size: 4}
      hidden: {enable_prefix_caching: false, max_num_seqs: 4, request_batch_size: 4}
      branches: {enable_prefix_caching: true, max_num_seqs: 4, request_batch_size: 4}
  hidden_extractor:
    method: extract_hidden_states
    connector: ExampleHiddenStatesConnector
    requested_zero_based_decoder_layer: 20
    vllm_aux_hidden_state_layer_ids: [21]
    vllm_layer_mapping: aux_id_equals_zero_based_decoder_layer_plus_one
    replay: exact_prompt_plus_dense_token_ids_as_prompt
    checkpoint_selection: prompt_length_plus_checkpoint_minus_one
    output_dtype: float16
    process_isolation: dedicated_fresh_python_process
  branch:
    kv_reuse_implementation: vllm_automatic_prefix_caching_full_blocks
    public_arbitrary_checkpoint_kv_fork_api: unavailable_in_vllm_0_18_1
    greedy_temperature: 0.0
    max_tokens: 48
vllm_risk_gate:
  candidate_profiles: [baseline_b1, branch_apc_b1, branch_apc_b2, full_apc_b2]
  batch4_policy: test_only_if_b2_exact_and_materially_unsaturated
  same_gpu_repeat_exact_required: true
  cross_gpu_exact_required: true
  batch_composition_token_exact_required: true
  batch_composition_hidden_exact_required: true
  minimum_material_speedup: 1.20
  preferred_max_batch_for_a100_40gb: 2
probe:
  shared_architecture: [5126, 384, 96, 1]
  optimizer: AdamW
  learning_rate: 0.00005
  weight_decay: 0.001
  point_loss: checkpoint_proper_bce
  trajectory_aggregation: normalized_softmin
  trajectory_softmin_beta: 0.5
  trajectory_weight: 1.0
calibration:
  primary_calibrator: trajectory_envelope_ltt
  candidate_threshold_source: probe_train_only
  certification_split: independent_calibration_only
  alphas: [0.005, 0.01, 0.02, 0.03, 0.05, 0.10]
  delta: 0.05
  objective: total_generated_token_reduction
  empirical_budget_B_used: false
data:
